<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NurseBand · Estación de Enfermería</title>
  <style>
    :root { --bg:#0f172a; --card:#111827; --ink:#e5e7eb; --muted:#9ca3af; }
    body { margin:0; font-family:system-ui,Segoe UI,Roboto,Arial; background:var(--bg); color:var(--ink); }
    header { padding:24px; border-bottom:1px solid #1f2937; display:flex; justify-content:space-between; align-items:center; }
    .title { font-size:20px; font-weight:700; }
    .sub { color:var(--muted); font-size:12px; }
    main { max-width:1100px; margin:24px auto; padding:0 16px; }
    .card { background:var(--card); border:1px solid #1f2937; border-radius:16px; padding:16px; box-shadow: 0 10px 20px rgba(0,0,0,.15); }
    .controls { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:12px; }
    input[type="text"] { background:#0b1220; color:var(--ink); border:1px solid #243045; padding:10px 12px; border-radius:10px; outline:none; }
    button { background:#2563eb; color:white; border:none; padding:10px 14px; border-radius:10px; cursor:pointer; }
    button:disabled { opacity:.6; cursor:not-allowed; }
    table { width:100%; border-collapse:collapse; margin-top:8px; }
    th, td { text-align:left; padding:10px; border-bottom:1px solid #1f2937; font-size:14px; }
    th { color:#9fb3d1; font-weight:600; }
    .badge { display:inline-block; padding:2px 8px; border-radius:999px; font-size:12px; background:#ef4444; color:white; }
    a { color:#93c5fd; text-decoration:none; }
    a:hover { text-decoration:underline; }
    footer { color:#6b7280; font-size:12px; text-align:center; padding:24px; }
  </style>
</head>
<body>
  <header>
    <div>
      <div class="title">NurseBand · Estación de Enfermería</div>
      <div class="sub">Alertas de ayuda en tiempo real + ficha del paciente</div>
    </div>
    <div class="sub">Auto-refresh 5 s</div>
  </header>

  <main>
    <section class="card">
      <div class="controls">
        <input id="filtro" type="text" placeholder="Filtrar por paciente..." />
        <button id="btnRecargar">Actualizar</button>
      </div>

      <div id="resumen" class="sub"></div>

      <table id="tabla">
        <thead>
          <tr>
            <th>Hora</th><th>Evento</th><th>N°</th><th>Paciente</th>
            <th>Pulso</th><th>SpO₂</th><th>Ficha</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <footer>NurseBand · Proyecto de Diseño Eléctrico — Dashboard simple en GitHub Pages.</footer>
  </main>

  <script>
    // ======= IDs / URLs =======
    const SHEET_ID = '1QO_2UFW26rbaXD79sc9gB1q1qKZDxpD9ctnj6GWuoq4';
    // APPS_SCRIPT_URL ya no se usa aquí, solo lo usa la pulsera
    // const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwmnggZnGz27FHQhBp83UYDnQkhEFD8xpOyI0NdA8bxG4Xb5pVNKEZR46xQ6xw3ewTM/exec';
    // ===========================

    const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=0`;

    const $tbody = document.querySelector('#tabla tbody');
    const $resumen = document.querySelector('#resumen');
    const $filtro = document.querySelector('#filtro');
    const $btnRec = document.querySelector('#btnRecargar');

    let rawRows = [];

    async function fetchCSV() {
      const res = await fetch(CSV_URL, { cache:'no-store' });
      const text = await res.text();
      return parseCSV(text);
    }

    function parseCSV(text) {
      const lines = text.split(/\r?\n/).filter(Boolean);
      lines.shift(); // quita encabezados
      return lines.map(splitCSV).map(cols => ({
        ts: cols[0], evento: cols[1], n: cols[2], paciente: cols[3],
        pulso: cols[4], spo2: cols[5], ficha: cols[6],
      }));
    }

    function splitCSV(line) {
      const out=[]; let cur='', inQ=false;
      for (let i=0;i<line.length;i++){
        const ch=line[i];
        if (ch === '"'){ inQ=!inQ; continue; }
        if (ch === ',' && !inQ){ out.push(cur); cur=''; continue; }
        cur += ch;
      }
      out.push(cur);
      return out.map(x=>x.replace(/^"(.*)"$/,'$1'));
    }

    // ts viene como "17/11/2025 9:19:00" (dd/mm/yyyy hh:mm:ss)
    function parseTS(ts){
      if (!ts) return null;
      const [datePart, timePart] = ts.split(' ');
      if (!datePart) return null;
      const [d,m,y] = datePart.split('/');
      if (!d || !m || !y) return null;
      // Construimos un string ISO para que Date lo entienda bien
      const iso = `${y}-${m.padStart(2,'0')}-${d.padStart(2,'0')}T${(timePart || '00:00:00')}`;
      const dObj = new Date(iso);
      return isNaN(dObj) ? null : dObj;
    }

    function fmtTS(ts){
      const d = parseTS(ts);
      return d ? d.toLocaleString('es-CL') : ts;
    }

    function render(rows) {
      // Ordenar SIEMPRE de más nuevo a más antiguo
      rows.sort((a,b)=>{
        const da = parseTS(a.ts);
        const db = parseTS(b.ts);
        if (!da && !db) return 0;
        if (!da) return 1;
        if (!db) return -1;
        return db - da;
      });

      const filtro = ($filtro.value||'').toLowerCase();
      const fil = filtro
        ? rows.filter(r => (r.paciente||'').toLowerCase().includes(filtro))
        : rows;

      $tbody.innerHTML = fil.map(r => `
        <tr>
          <td>${fmtTS(r.ts)}</td>
          <td><span class="badge">${r.evento || 'Ayuda'}</span></td>
          <td>${r.n || ''}</td>
          <td>${r.paciente || ''}</td>
          <td>${r.pulso || ''}</td>
          <td>${r.spo2 || ''}</td>
          <td>${r.ficha ? `<a href="${r.ficha}" target="_blank" rel="noopener">Ver ficha</a>` : ''}</td>
        </tr>`).join('');

      $resumen.textContent = `Registros: ${rows.length} · Mostrando: ${fil.length}`;
    }

    async function cargar(){
      try{
        rawRows = await fetchCSV();

        // Quitar filas vacías de verdad
        rawRows = rawRows.filter(r => r.ts && r.paciente);

        render(rawRows);
      }
      catch{
        $resumen.textContent = 'No se pudo leer la Sheet (¿permiso público y ID correctos?)';
      }
    }

    $btnRec.addEventListener('click', cargar);
    $filtro.addEventListener('input', ()=>render(rawRows));

    setInterval(cargar, 5000);
    cargar();
  </script>
</body>
</html>
